services:
  - type: web
    name: educonnect-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: CLIENT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        sync: false
      - key: STORAGE_DRIVER
        value: local
      - key: METERED_SUBDOMAIN
        sync: false
      - key: METERED_API_KEY
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: ADMIN_INVITE_CODE
        sync: false
      - key: GROQ_API_KEY
        sync: false
